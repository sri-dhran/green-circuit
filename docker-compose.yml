version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: greencircuit-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ewaste_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      
  backend:
    build: ./backend
    container_name: greencircuit-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/ewaste_db?createDatabaseIfNotExist=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_MAIL_HOST=smtp.mailtrap.io
      - SPRING_MAIL_PORT=2525
      - SPRING_MAIL_USERNAME=dummy
      - SPRING_MAIL_PASSWORD=dummy
    depends_on:
      - db
      
  frontend:
    build: ./frontend
    container_name: greencircuit-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
