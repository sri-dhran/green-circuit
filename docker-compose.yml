services:
  db:
    image: mysql:8.0
    container_name: greencircuit-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ewaste_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      
  backend:
    build: ./backend
    container_name: greencircuit-backend
    ports:
      - "8080:8080"
    environment:
      - "SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/ewaste_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_MAIL_HOST=smtp.mailtrap.io
      - SPRING_MAIL_PORT=2525
      - SPRING_MAIL_USERNAME=dummy
      - SPRING_MAIL_PASSWORD=dummy
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
      
  frontend:
    build: ./frontend
    container_name: greencircuit-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: on-failure

volumes:
  db_data:
